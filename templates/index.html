<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten a link</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6672; --line:#d9dde3; --accent:#0b6bcb; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --card:#1d2127; --ink:#eceff3; --muted:#9aa4b0; --line:#323943; --accent:#5aa7f5; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.75rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:0 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; margin-bottom:14px; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:6px 12px; }
  .msg { margin-top:14px; min-height:1.5em; }
  .err { color:var(--err); }
  .result { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .result a { font-weight:600; color:var(--accent); word-break:break-all; }
  h2 { font-size:1.1rem; margin:32px 0 8px; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:10px 0; border-bottom:1px solid var(--line); }
  li small { display:block; color:var(--muted); overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <h1>Shorten a link</h1>
  <p class="lead">Paste a long URL and get a short one that redirects to it.</p>

  {% if not_found %}
  <p class="err" role="alert">No short link exists for “{{ not_found }}”. Create one below.</p>
  {% endif %}

  <div class="card">
    <form id="f">
      <label for="url">Long URL</label>
      <input id="url" type="url" placeholder="https://example.com/a/very/long/path" required>
      <label for="code">Custom code (optional)</label>
      <input id="code" type="text" placeholder="my-link" pattern="[A-Za-z0-9_\-]{3,32}">
      <button type="submit">Shorten link</button>
    </form>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>

  <h2>Recent links</h2>
  <ul id="list"><li><small>No links yet. Shorten one above.</small></li></ul>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadList() {
  const rows = await (await fetch('/api/urls')).json();
  if (!rows.length) return;
  $('list').innerHTML = rows.map(r =>
    `<li><a href="${esc(r.short_url)}" target="_blank" rel="noopener">${esc(r.short_url)}</a>
     <small>${esc(r.long_url)} &mdash; ${r.clicks} click${r.clicks === 1 ? '' : 's'}</small></li>`).join('');
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg');
  msg.className = 'msg'; msg.textContent = 'Shortening…';
  const res = await fetch('/api/shorten', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url: $('url').value, custom_code: $('code').value})
  });
  const data = await res.json();
  if (!res.ok) { msg.className = 'msg err'; msg.textContent = data.error; return; }
  msg.innerHTML = `<div class="result"><a href="${esc(data.short_url)}" target="_blank" rel="noopener">${esc(data.short_url)}</a>
    <button type="button" class="ghost" id="copy">Copy link</button></div>`;
  $('copy').onclick = async () => { await navigator.clipboard.writeText(data.short_url); $('copy').textContent = 'Copied'; };
  loadList();
});
loadList();
</script>
</body>
</html>
